
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冒険の記録</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #080e1b;
  color: #f4e6c1;
  font-family: monospace;
  display: grid;
  place-items: center;
  padding: 20px;
}
.game {
  width: min(900px, 100%);
  min-height: 570px;
  position: relative;
  overflow: hidden;
  border: 4px solid #b99a61;
  box-shadow: 0 0 0 5px #202a3b, 0 0 45px #6d5aa055;
  background:
    radial-gradient(ellipse at 50% 30%, #a18a5a44, transparent 55%),
    linear-gradient(#17253a, #101a2b 65%, #080e19);
}
.stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(#f4e6c1 1px, transparent 1px),
    radial-gradient(#c7b5e9 1px, transparent 1px);
  background-size: 53px 47px, 79px 61px;
  opacity: .35;
}
.scene {
  position: relative;
  min-height: 570px;
  padding: 38px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.eyebrow { letter-spacing: 4px; font-size: 11px; color: #c7b5e9; }
h1 {
  font-size: clamp(28px, 6vw, 48px);
  line-height: 1.5;
  margin: 15px 0 5px;
  text-shadow: 3px 3px #382d4b;
}
.subtitle { color: #d1c3a5; font-size: 12px; letter-spacing: 2px; }
.library {
  width: min(450px, 95%);
  height: 130px;
  margin: 25px auto;
  position: relative;
  border-bottom: 8px solid #94734b;
  background:
    linear-gradient(90deg, transparent 8%, #473650 8% 12%,
    transparent 12% 43%, #473650 43% 47%, transparent 47% 88%,
    #473650 88% 92%, transparent 92%);
}
.shelf {
  position: absolute;
  left: 0; right: 0;
  height: 7px;
  background: #94734b;
}
.shelf.one { top: 42px; }
.shelf.two { top: 88px; }
.book {
  position: absolute;
  bottom: 8px;
  width: 16px;
  height: 31px;
  background: #b36e58;
  border: 2px solid #e0bf81;
  box-shadow: 23px -1px #657c9b, 46px 2px #77704e,
              69px -3px #a78abb, 92px 0 #53796c;
}
.book.top { bottom: 54px; left: 27%; }
.book.bottom { bottom: 8px; left: 48%; }
.menu {
  width: min(330px, 100%);
  background: #101a2bee;
  border: 3px solid #b99a61;
  padding: 12px;
  text-align: left;
}
.menu button {
  display: block;
  width: 100%;
  padding: 11px;
  border: 0;
  background: transparent;
  color: #f4e6c1;
  text-align: left;
  font: inherit;
  cursor: pointer;
}
.menu button:hover, .menu button:focus {
  color: #ffe39a;
  background: #ffffff12;
  outline: 1px solid #b99a61;
}
.hint { font-size: 11px; color: #a9b4c8; margin-top: 15px; }
#content { display: none; max-width: 600px; line-height: 1.9; }
#content h2 { color: #ffe39a; }
.back {
  color: #ffe39a;
  background: #101a2b;
  border: 2px solid #b99a61;
  padding: 12px 18px;
  font: inherit;
  cursor: pointer;
}
.art-grid {
  display: flex;
  justify-content: center;
  padding: 20px;
}

.art-image {
  max-width: 100%;
  width: 500px;
  height: auto;
  border: 4px solid #b89b67;
  box-shadow: 0 0 12px #000;
}

/* スワイプ式ギャラリー */
.art-gallery {
  width: 100%;
  max-width: 540px;
  margin: 20px auto;
}

.art-slide {
  display: none;
}

.art-slide.active {
  display: block;
}

.art-slide .art-image {
  display: block;
  width: 100%;
  max-width: 500px;
  max-height: 60vh;
  object-fit: contain;
  margin: 0 auto;
}

.gallery-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-top: 15px;
}

.gallery-controls button {
  background: #101a2b;
  color: #ffe39a;
  border: 2px solid #b99a61;
  padding: 8px 16px;
  font: inherit;
  cursor: pointer;
}

#galleryCount {
  font-size: 12px;
  color: #d1c3a5;
}

</style>
</head>
<body>
<main class="game">
  <div class="stars"></div>
  <section class="scene" id="home">
    <p class="eyebrow">✦ THE FORGOTTEN ARCHIVE ✦</p>
    <h1>冒険の記録</h1>
    <p class="subtitle">ILLUSTRATOR PORTFOLIO</p>
    <div class="library" aria-hidden="true">
      <div class="shelf one"></div>
      <div class="shelf two"></div>
      <div class="book top"></div>
      <div class="book bottom"></div>
    </div>
    <nav class="menu" aria-label="メインメニュー">
      <button onclick="showPage('start')">▶ はじめから</button>
      <button onclick="showPage('gallery')">▶ ギャラリー</button>
      <button onclick="showPage('profile')">▶ プロフィール</button>
      <button onclick="showPage('request')">▶ 依頼について</button>
      <button onclick="showPage('contact')">▶ お問い合わせ</button>
    </nav>
    <p class="hint">▼ コマンドを選択してください ▼</p>
  </section>

  <section class="scene" id="content">
    <p class="eyebrow">✦ THE FORGOTTEN ARCHIVE ✦</p>
    <h2 id="pageTitle"></h2>
    <div id="pageText"></div>
    <button class="back" onclick="goHome()">◀ メニューに戻る</button>
  </section>
</main>
<script>
const pages = {
  start: ["冒険のはじまり", "古い書庫の扉が開いた。<br>ここには、まだ誰も知らない作品が眠っている……"],
  
  gallery: ["作品ギャラリー", `
  <div class="art-gallery" id="artGallery">
    <div class="art-slide active">
      <img src="./images/art01.jpg" alt="ちぃぽおめでとう" class="art-image">
    </div>
    <div class="art-slide">
      <img src="./images/art02.jpg" alt="たけむ" class="art-image">
    </div>
    <div class="gallery-controls">
      <button onclick="changeArt(-1)">◀ 前へ</button>
      <span id="galleryCount">1 / 2</span>
      <button onclick="changeArt(1)">次へ ▶</button>
    </div>
    <p class="hint">画像を左右にスワイプして切り替え</p>
  </div>
`],

  profile: ["プロフィール", "ここに自己紹介や活動実績を掲載するよ。"],
  request: ["依頼について", "料金表や依頼条件をここに掲載する予定だよ。"],
  contact: ["お問い合わせ", "連絡先や依頼フォームをここに用意するよ。"]
};
function showPage(id) {
  document.getElementById("home").style.display = "none";
  document.getElementById("content").style.display = "flex";
  document.getElementById("pageTitle").textContent = pages[id][0];
  document.getElementById("pageText").innerHTML = pages[id][1];

  if (id === "gallery") {
    currentArt = 0;
    updateArt();
  }
}
}
function goHome() {
  document.getElementById("content").style.display = "none";
  document.getElementById("home").style.display = "flex";
}

let currentArt = 0;

function updateArt() {
  const slides = document.querySelectorAll(".art-slide");
  if (!slides.length) return;

  currentArt = (currentArt + slides.length) % slides.length;

  slides.forEach((slide, index) => {
    slide.classList.toggle("active", index === currentArt);
  });

  const count = document.getElementById("galleryCount");
  if (count) {
    count.textContent = `${currentArt + 1} / ${slides.length}`;
  }
}

function changeArt(direction) {
  const slides = document.querySelectorAll(".art-slide");
  if (!slides.length) return;

  currentArt += direction;
  updateArt();
}

const artGallery = document.getElementById("content");
let touchStartX = 0;

artGallery.addEventListener("touchstart", (event) => {
  touchStartX = event.changedTouches[0].screenX;
}, { passive: true });

artGallery.addEventListener("touchend", (event) => {
  const touchEndX = event.changedTouches[0].screenX;
  const difference = touchEndX - touchStartX;

  if (Math.abs(difference) > 50 &&
      document.getElementById("artGallery")) {
    changeArt(difference < 0 ? 1 : -1);
  }
}, { passive: true });

</script>
</body>
</html>
